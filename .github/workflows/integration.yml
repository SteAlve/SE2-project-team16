# This workflow performs integration checks on the dev branch.
#
# It runs whenever the dev branch is updated and verifies
# that the integrated version of the project passes the
# code quality checks and the tests.

name: Integration CI

on:
  push:
    branches:
      - dev

jobs:
  integration:
    # Run the integration checks on a temporary Ubuntu machine.
    runs-on: ubuntu-latest

    steps:

      # Download the current version of the repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the Node.js version specified by the project.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: server/package-lock.json

      # Install the server dependencies.
      - name: Install dependencies
        working-directory: server
        run: npm ci

      # Check the integrated code with ESLint.
      - name: Run lint
        working-directory: server
        run: npm run lint

      # Run the unit and integration tests. Vitest runs both in one go: the integration
      # ones are the tests that work on a real SQLite database (dao, database, seed).
      - name: Run unit and integration tests
        working-directory: server
        run: npm test

      # TODO: Build the application once a production build is available.
