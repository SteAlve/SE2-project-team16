name: Branch Flow

on:
  pull_request:
    branches:
      - main
      - qa

jobs:
  validate-branch-flow:
    name: Validate branch flow
    runs-on: ubuntu-latest

    steps:
      - name: Validate source branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          echo "Pull Request: $HEAD_BRANCH -> $BASE_BRANCH"

          if [[ "$BASE_BRANCH" == "main" && "$HEAD_BRANCH" != "qa" ]]; then
            echo "ERROR: Only 'qa' can be merged into 'main'."
            exit 1
          fi

          if [[ "$BASE_BRANCH" == "qa" ]]; then
            case "$HEAD_BRANCH" in
              dev | fix/* | test/*) ;;
              *)
                echo "ERROR: Only 'dev' (a new batch) or 'fix/*' and 'test/*' branches"
                echo "(changes to the batch already in qa) can be merged into 'qa'."
                exit 1
                ;;
            esac
          fi

          echo "Branch flow is valid."

  # qa tests one batch at a time: a new dev -> qa PR waits until the batch already in qa
  # has been promoted to main. Otherwise untested work from dev would mix with it.
  # fix/* and test/* PRs are not held back: they stabilize that batch, so they must be able
  # to reach qa while it is still there.
  qa-promotion-gate:
    name: Qa is promoted to main
    if: github.base_ref == 'qa' && github.head_ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that qa has no commits missing from main
        run: |
          pending=$(git rev-list --count origin/main..origin/qa)

          if [ "$pending" -ne 0 ]; then
            echo "ERROR: qa has $pending commit(s) that are not in main yet."
            echo "Test qa and promote it to main before opening a new dev -> qa PR."
            git log --oneline --no-merges origin/main..origin/qa
            exit 1
          fi

          echo "qa is fully promoted to main."